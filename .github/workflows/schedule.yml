name: Autonomous Living Tool Network

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests google-generativeai

      - name: Run Autonomous Orchestrator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit and Push Generated Tool
        run: |
          git config --global user.name "AI Machine Bot"
          git config --global user.email "bot@ai.local"
          git add .
          git commit -m "Autonomous nightly tool update [skip ci]" || echo "No changes to commit"
          git push

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
