name: Autonomous Micro-Tool Network Midnight Pipeline

on:
  schedule:
    # Runs automatically every midnight at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      manual_topic:
        description: 'Optional manual tool topic or trend query override (leave blank for dynamic trend discovery)'
        required: false
        default: ''
      skip_deploy:
        description: 'Skip Firebase deployment (test run only)'
        type: boolean
        default: false
      force_heal:
        description: 'Force triage of all items in error_log.json'
        type: boolean
        default: false

concurrency:
  group: micro-tool-network-midnight
  cancel-in-progress: false

jobs:
  run-midnight-pipeline:
    name: Execute 24h Autonomous Loop
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set up Node.js 20 (for Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Master Orchestrator (main.py)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          ADSENSE_PUB_ID: ${{ secrets.ADSENSE_PUB_ID }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://yourdomain.com' }}
          SITE_NAME: ${{ secrets.SITE_NAME || 'OmniTools Hub' }}
          MANUAL_TOPIC: ${{ github.event.inputs.manual_topic || '' }}
          FORCE_HEAL: ${{ github.event.inputs.force_heal || 'false' }}
        run: |
          python main.py

      - name: Commit and Push New Tools, Archives & Index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new changes or tools generated to commit."
          else
            git commit -m "chore(auto): autonomous midnight pipeline update [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi

      - name: Deploy Statically to Firebase Hosting (Spark Free Tier)
        if: ${{ github.event.inputs.skip_deploy != 'true' && env.FIREBASE_TOKEN != '' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive
